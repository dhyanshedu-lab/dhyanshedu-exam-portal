name: Validate free public exams

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "app.js"
      - "index.html"
      - "migrations/**"
      - "docs/features/free-public-exams.md"
      - ".github/workflows/validate-free-public-exams.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Worker and portal JavaScript syntax
        run: |
          node --check worker/index.js
          node --check worker/public-exams.js
          node --check app.js
      - name: Validate public exam DDL on disposable SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          source = open("migrations/0001_dhyanshedu_consolidated.sql", encoding="utf-8").read()
          start = source.index("CREATE TABLE IF NOT EXISTS public_exam_publications")
          end = source.index("-- 6. Uploaded handwritten answer sheets", start)
          ddl = source[start:end]
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          for table in ("users", "curricula", "exam_pathways", "enquiries", "exams", "exam_attempts"):
              db.execute(f"CREATE TABLE {table} (id TEXT PRIMARY KEY)")
          db.execute("CREATE TABLE questions (id TEXT PRIMARY KEY, question_type TEXT)")
          db.execute("CREATE TABLE exam_questions (id TEXT PRIMARY KEY, exam_id TEXT REFERENCES exams(id), question_id TEXT REFERENCES questions(id))")
          db.executescript(ddl)
          expected = {"public_exam_publications", "public_assessment_registrations", "public_assessment_attempts", "public_assessment_answers", "public_assessment_rate_limits"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          if missing:
              raise SystemExit("Missing public exam tables: " + ", ".join(sorted(missing)))
          db.execute("INSERT INTO exams(id) VALUES('exam-1')")
          db.execute("INSERT INTO questions(id, question_type) VALUES('q-mcq', 'mcq'), ('q-written', 'short_answer')")
          db.execute("INSERT INTO exam_questions(id, exam_id, question_id) VALUES('question-1', 'exam-1', 'q-mcq'), ('question-2', 'exam-1', 'q-written')")
          db.execute("INSERT INTO public_assessment_registrations(id,student_name,parent_name,phone,email,class_label,privacy_notice_version,privacy_consent_at,marketing_consent,identity_key) VALUES(?,?,?,?,?,?,'2026-11-v1',?,?,?)",
                     ("reg-1", "Test Student", None, "9999999999", None, "Class 10", "2026-11-22T00:00:00Z", 0, "identity-hash"))
          db.execute("INSERT INTO public_assessment_attempts(id,registration_id,exam_id,attempt_number,access_token_hash,started_at,expires_at,status) VALUES(?,?,?,?,?,?,?,'in_progress')",
                     ("attempt-1", "reg-1", "exam-1", 1, "token-hash", "2026-11-22T00:00:00Z", "2026-11-22T01:00:00Z"))
          db.execute("INSERT INTO public_assessment_answers(id,public_attempt_id,exam_question_id,selected_option_ids,is_correct,marks_awarded) VALUES(?,?,?,?,?,?)",
                     ("answer-1", "attempt-1", "question-1", "[]", 1, 1))
          db.execute("INSERT INTO public_assessment_answers(id,public_attempt_id,exam_question_id,answer_text,marks_awarded) VALUES(?,?,?,?,?)",
                     ("answer-2", "attempt-1", "question-2", "written response", 2))
          auto = db.execute("SELECT COALESCE(SUM(COALESCE(pa.marks_awarded,0)),0) FROM public_assessment_answers pa WHERE pa.public_attempt_id=? AND pa.exam_question_id NOT IN (SELECT eq.id FROM exam_questions eq JOIN questions q ON q.id=eq.question_id WHERE eq.exam_id=? AND q.question_type IN ('numerical','short_answer','long_answer'))",
                            ("attempt-1", "exam-1")).fetchone()[0]
          if auto + 2 != 3:
              raise SystemExit("Public exam manual score aggregation is incorrect.")
          db.execute("INSERT INTO public_assessment_rate_limits(id,ip_hash,route_key,window_start,request_count) VALUES(?,?,?,?,1)",
                     ("rate-1", "hashed-ip", "register:exam-1", 1000))
          count = db.execute("INSERT INTO public_assessment_rate_limits(id,ip_hash,route_key,window_start,request_count) VALUES(?,?,?,?,1) ON CONFLICT(ip_hash,route_key,window_start) DO UPDATE SET request_count=request_count+1 RETURNING request_count",
                             ("rate-2", "hashed-ip", "register:exam-1", 1000)).fetchone()[0]
          if count != 2:
              raise SystemExit("Public exam rate-limit counter did not increment.")
          violations = list(db.execute("PRAGMA foreign_key_check"))
          if violations:
              raise SystemExit("Foreign key validation failed: " + repr(violations))
          print("Public exam DDL passed in disposable SQLite.")
          PY
