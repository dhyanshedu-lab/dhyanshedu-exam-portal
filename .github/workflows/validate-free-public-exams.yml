name: Validate free public exams

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "app.js"
      - "index.html"
      - "migrations/**"
      - "docs/features/free-public-exams.md"
      - ".github/workflows/validate-free-public-exams.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Worker and portal JavaScript syntax
        run: |
          node --check worker/index.js
          node --check worker/public-exams.js
          node --check app.js
      - name: Validate public exam DDL and no-answer-storage rule
        run: |
          python3 - <<'PY'
          import sqlite3
          source = open("migrations/0001_dhyanshedu_consolidated.sql", encoding="utf-8").read()
          start = source.index("CREATE TABLE IF NOT EXISTS public_exam_publications")
          end = source.index("-- 6. Uploaded handwritten answer sheets", start)
          ddl = source[start:end]
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          for table in ("users", "curricula", "exam_pathways", "enquiries", "exams"):
              db.execute(f"CREATE TABLE {table} (id TEXT PRIMARY KEY)")
          db.executescript(ddl)
          expected = {"public_exam_publications", "public_assessment_registrations", "public_assessment_attempts", "public_assessment_rate_limits"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          if missing:
              raise SystemExit("Missing public exam tables: " + ", ".join(sorted(missing)))
          if "public_assessment_answers" in actual or "public_assessment_answers" in source:
              raise SystemExit("Public answer storage table or reference must not exist in the migration.")
          columns = {row[1] for row in db.execute("PRAGMA table_info(public_assessment_attempts)")}
          forbidden = {"answer_text", "selected_option_ids", "answers_json"}
          if columns & forbidden:
              raise SystemExit("Attempt metadata must not contain answer fields.")
          db.execute("INSERT INTO exams(id) VALUES('exam-1')")
          db.execute("INSERT INTO public_assessment_registrations(id,student_name,phone,class_label,privacy_notice_version,privacy_consent_at,identity_key) VALUES('reg-1','Test Student','9999999999','Class 10','test-v1','2026-11-22T00:00:00Z','identity-hash')")
          db.execute("INSERT INTO public_assessment_attempts(id,registration_id,exam_id,attempt_number,access_token_hash,started_at,expires_at,status) VALUES('attempt-1','reg-1','exam-1',1,'token-hash','2026-11-22T00:00:00Z','2026-11-22T01:00:00Z','in_progress')")
          db.execute("UPDATE public_assessment_attempts SET status='submitted',submitted_at='2026-11-22T00:30:00Z',score=4,total_marks=5,percentage=80 WHERE id='attempt-1'")
          row = db.execute("SELECT status,score,total_marks,percentage FROM public_assessment_attempts WHERE id='attempt-1'").fetchone()
          if row != ("submitted", 4.0, 5.0, 80.0):
              raise SystemExit("Final score summary did not persist correctly.")
          db.execute("INSERT INTO public_assessment_rate_limits(id,ip_hash,route_key,window_start,request_count) VALUES('rate-1','hashed-ip','register:exam-1',1000,1)")
          count = db.execute("INSERT INTO public_assessment_rate_limits(id,ip_hash,route_key,window_start,request_count) VALUES('rate-2','hashed-ip','register:exam-1',1000,1) ON CONFLICT(ip_hash,route_key,window_start) DO UPDATE SET request_count=request_count+1 RETURNING request_count").fetchone()[0]
          if count != 2:
              raise SystemExit("Public exam rate-limit counter did not increment.")
          violations = list(db.execute("PRAGMA foreign_key_check"))
          if violations:
              raise SystemExit("Foreign key validation failed: " + repr(violations))
          print("Public exam DDL passed; only enquiry identity and final score are persisted.")
          PY
